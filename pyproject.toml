[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myrewards-intelligence"
version = "0.1.0"
description = "Predictive scoring, claims validation, and ROI intelligence for InComm MyRewards"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "KSU mHealth Research Lab"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<2.0",
    "scikit-learn>=1.3,<2.0",
    "lightgbm>=4.0,<5.0",
    "shap>=0.43,<1.0",
    "python-docx>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "pyodbc>=5.0,<6.0",
    "python-dotenv>=1.0,<2.0",
    "matplotlib>=3.7,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<6.0",
    "black>=24.0,<25.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.8,<2.0",
    "pre-commit>=3.6,<4.0",
    "pandas-stubs>=2.0,<3.0",
    "types-PyYAML>=6.0,<7.0",
]

[project.scripts]
myrewards-m5 = "myrewards_intelligence.cli.run_milestone5:main"
myrewards-m6 = "myrewards_intelligence.cli.run_milestone6:main"
myrewards-m7 = "myrewards_intelligence.cli.run_milestone7:main"

[tool.hatch.build.targets.wheel]
packages = ["src/myrewards_intelligence"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "B",      # bugbear
    "I",      # isort
    "UP",     # pyupgrade
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
]

[tool.ruff.lint.isort]
known-first-party = ["myrewards_intelligence"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
files = ["src/"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = [
    "docx.*",
    "shap.*",
    "lightgbm.*",
    "pyodbc.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
