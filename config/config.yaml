# MyRewards Intelligence configuration
# All paths are relative to the project root unless absolute.

project:
  name: "MyRewards Intelligence"
  description: "Predictive scoring, claims validation, and ROI intelligence"

paths:
  # Input data (gitignored — copy from reference repo or configure reference path)
  data_dir: data
  analytical_dataset: data/analytical_dataset.csv

  # Reference repo path (alternative to copying data locally)
  reference_repo: /Volumes/research/mhealth/InComm/Milestones/InComm_Milestone2
  reference_dataset: outputs/csv/analytical_dataset.csv

  # Output paths
  models_dir: models
  reports_dir: reports
  logs_dir: logs

mode:
  # auto | connected | offline
  # auto: try to connect, fall back to offline
  # connected: require database connection
  # offline: never attempt database connection
  requested: auto

layer_prefixes:
  stg_: Staging
  can_: Canonical
  der_: Derived
  ref_: Reference
  cam_: Campaign
  sim_: Simulation

milestone5:
  # Model training settings
  test_size: 0.2
  random_state: 42
  diagnostic_seeds: [42, 123, 456, 789, 2026]

  # LightGBM hyperparameters
  lgbm_params:
    objective: binary
    metric: auc
    boosting_type: gbdt
    num_leaves: 31
    learning_rate: 0.05
    feature_fraction: 0.9
    bagging_fraction: 0.8
    bagging_freq: 5
    verbose: -1
    n_estimators: 200

  # Operating threshold for precision/recall reporting
  operating_threshold: 0.5

  # Score tiers for der_MemberImpactScores
  score_tiers:
    high: 0.7
    medium: 0.4
    # below medium threshold = Low

milestone6:
  # S = HAR assignment reconstruction; R = IncentiveRewards-shaped ledger
  track: R
  test_size: 0.2
  random_state: 42
  diagnostic_seeds: [42, 123, 456, 789, 2026]
  observation_window_days: 90
  split_mode: grouped_stratified
  shareable_dir: milestone6_shareables
  ablation_scores_path: models/scored_model_a_ablation.csv
  issuance_ledger_path: models/incentive_rewards_mock.csv
  generate_incentive_rewards_mock: true
  mock_treat_probability: 0.45
  mock_issue_lag_days_min: 7
  mock_issue_lag_days_max: 45
  mock_redeem_probability: 0.55
  # gap_level = Closed ⇔ eligible ⇔ HAR case (Track S).
  # member_broadcast = lifetime sim count copied onto every gap (M4 artifact).
  treatment_grain: gap_level
  min_arm_n: 50
  min_ess_ratio: 0.25
  volume_cutpoints: [0.0, 0.03, 0.05, 0.08, 0.10, 0.15]
  uplift_tiers:
    tau_treat: 0.05
    propensity_high: 0.5
    high: 0.10
    medium: 0.03

logging:
  level: INFO
